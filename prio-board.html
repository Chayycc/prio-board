  .tg-eff{font-family:var(--mono);font-size:.66rem;font-weight:700;color:var(--accent-ink);background:var(--accent-soft);border-radius:6px;padding:2px 7px;flex:none}
  .tg-track{position:relative;flex:1;display:flex;min-height:36px}
  .tg-cell{flex:none;border-left:1px solid var(--line)}
  .tg-bar{position:absolute;top:50%;transform:translateY(-50%);height:21px;border-radius:6px;display:flex;align-items:center;padding:0 8px;color:#fff;font-size:.64rem;font-weight:700;white-space:nowrap;overflow:hidden;box-shadow:var(--shadow);cursor:pointer;z-index:1}
  .tg-flag{position:absolute;top:50%;transform:translateY(-50%);font-size:.68rem;color:var(--ink-soft);white-space:nowrap}
  .tg-today{position:absolute;top:0;bottom:0;width:2px;background:var(--hi);z-index:2}
  .tg-today .tdlbl{position:absolute;top:2px;left:50%;transform:translateX(-50%);font-family:var(--mono);font-size:.52rem;font-weight:800;color:#fff;background:var(--hi);padding:1px 5px;border-radius:4px}
  /* Grid */
  .grid-wrap{border:1px solid var(--line);border-radius:14px;background:var(--surface);overflow:hidden;margin-top:12px}
  .gscroll{overflow-x:auto}
  table.gt{border-collapse:collapse;width:100%;min-width:1120px;font-size:.82rem}
  .gt thead th{position:sticky;top:0;z-index:2;background:var(--surface-2);text-align:left;padding:11px 12px;font-family:var(--mono);font-size:.62rem;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-soft);font-weight:700;border-bottom:1px solid var(--line);cursor:pointer;white-space:nowrap;user-select:none}

  .gt thead th.sorted .ar{opacity:1;color:var(--accent)}
  .gt tbody td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
  .gt tbody tr:last-child td{border-bottom:0}
  .gt tbody tr:hover{background:var(--surface-2)}
  .gt .gid{font-family:var(--mono);color:var(--ink-soft);font-weight:700;text-align:right}
  .gt .gtitle{font-weight:600;max-width:330px;line-height:1.35;cursor:pointer}
  .gt .gtitle:hover{color:var(--accent)}
  .gt .gdept{white-space:nowrap;color:var(--ink-soft)}
  .gt .gstp{font-weight:700;border-radius:7px;padding:3px 9px;font-size:.74rem;white-space:nowrap;color:#fff;display:inline-block}
  .gt .geff{font-family:var(--mono);font-weight:700;text-align:center}

  .gt .gdl{font-family:var(--mono);color:var(--hi);font-weight:700;white-space:nowrap;text-align:center}
  .gt .gedit{color:var(--copper);cursor:pointer;background:none;border:1px solid var(--line);border-radius:8px;padding:3px 9px;font-size:.9rem}
  .gt .gcmt{max-width:200px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink-soft);font-size:.78rem}

  .khead .kt{font-weight:700;font-size:.95rem}
  .khead .kc{margin-left:auto;font-family:var(--mono);font-size:.72rem;font-weight:700;color:var(--ink-soft);background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:2px 9px}
  .kcap{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 10px;display:flex;flex-direction:column;gap:6px}
  .kcap .cr{display:flex;align-items:center;justify-content:space-between;font-size:.76rem}
  .kcap .cr .k{color:var(--ink-soft)}
  .kcap .cr .v{font-family:var(--mono);font-weight:700}
  .kcap .val-target{font-family:var(--mono);font-weight:700;border:1px solid var(--line);border-radius:7px;padding:1px 7px;background:var(--surface-2)}
  .rem{font-family:var(--mono);font-weight:800;border-radius:7px;padding:2px 9px}
  .rem.ok{color:var(--ok);background:var(--ok-soft)}
  .rem.over{color:var(--hi);background:var(--hi-soft)}
  .capbar{height:6px;border-radius:99px;background:var(--surface-3);overflow:hidden}
  .capbar i{display:block;height:100%;border-radius:99px}
  .kcards{display:flex;flex-direction:column;gap:9px;min-height:20px}
  .kcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 12px;box-shadow:var(--shadow);transition:.15s;border-left:3px solid var(--st-todo)}
  .kcard:hover{transform:translateY(-1px);border-color:var(--ink-soft)}
  .kc-top{display:flex;align-items:center;gap:8px;margin-bottom:6px}
  .kc-id{font-family:var(--mono);font-size:.72rem;color:var(--ink-soft);font-weight:700}
  .kc-dept{margin-left:auto;font-size:.68rem;font-weight:700;color:var(--accent-ink);background:var(--accent-soft);border-radius:99px;padding:2px 9px}
  .kc-title{font-size:.9rem;font-weight:600;line-height:1.32;margin-bottom:9px;cursor:pointer}
  .kc-title:hover{color:var(--accent)}
  .kc-meta{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
  .kc-due{font-family:var(--mono);font-size:.7rem;font-weight:700;color:var(--hi);background:var(--hi-soft);border-radius:7px;padding:2px 8px}
  .kc-eff{font-family:var(--mono);font-size:.7rem;font-weight:700;color:var(--ink-soft)}
  .kratio{margin-left:auto;font-family:var(--mono);font-size:.74rem;font-weight:800;border-radius:8px;padding:3px 10px}
  .kratio.hi{color:#fff;background:var(--ok)} .kratio.mid{color:#fff;background:var(--accent)} .kratio.lo{color:var(--ink-soft);background:var(--surface-3)}

  // ===== shared helpers for new views (Projects) =====

  const nvWire=fn=>{const b=$("#nvBUsel");if(b)b.addEventListener("change",function(){nvBU=this.value;fn();});const s=$("#nvStatSel");if(s)s.addEventListener("change",function(){nvStat=this.value;fn();});};
  const nvLastCmt=o=>{const cs=o.comments||[],l=cs[cs.length-1];return l?((cs.length>1?`(${cs.length}) `:"")+(l.by?l.by+": ":"")+(l.text||"")):"";};
  const pWeeks=p=>{const d=dayspan(p.start,p.end);return d?Math.max(1,Math.round(d/7)):(EMAP[p.size]||3)*2;};
  const nvRatioCls=r=>r>=1.1?"hi":r>=0.7?"mid":"lo";

  function nvMonths(items){
    let mn=null,mx=null;
    items.forEach(o=>{const s=nvYmd(o.start),e=nvYmd(o.end);if(s&&(!mn||s<mn))mn=s;if(e&&(!mx||e>mx))mx=e;});
    const now=new Date();now.setHours(0,0,0,0);
    if(!mn)mn=new Date(now.getFullYear(),0,1); if(!mx)mx=new Date(now.getFullYear(),11,31);
    if(now<mn)mn=now; if(now>mx)mx=now;
    let arr=[],y=mn.getFullYear(),m=mn.getMonth(),ey=mx.getFullYear(),em=mx.getMonth();
    while(y<ey||(y===ey&&m<=em)){arr.push({y,m,days:new Date(y,m+1,0).getDate()});m++;if(m>11){m=0;y++;}}

  function nvColX(d,mos,cw){for(let i=0;i<mos.length;i++){if(d.getFullYear()===mos[i].y&&d.getMonth()===mos[i].m)return i*cw+(d.getDate()-1)/mos[i].days*cw;}if(d<new Date(mos[0].y,mos[0].m,1))return 0;return mos.length*cw;}

    main.innerHTML=`

          ${nvFilterHTML()}

          <button class="ghost sub-toggle${tlSubs?" on":""}" id="tlSubBtn">${tlSubs?"▾":"▸"} Sub-task</button>
        </div>
      </div>
      <div class="tgt"><div class="tgt-scroll" id="tgtScroll">
        <div class="tg-head"><div class="tg-l1">Project</div><div class="tg-l2">BU/ฝ่าย (ที่มาขอ)</div><div class="tg-l3">Status</div><div class="tg-l4">Effort</div><div class="tg-months">${mos.map(mo=>`<div class="tg-mo" style="width:${cw}px"><div class="mo-lbl">${NV_MON[mo.m]} ${String(mo.y).slice(2)}</div><div class="tg-ticks"><span>1</span><span>15</span><span>${mo.days}</span></div></div>`).join("")}</div></div>

  const KAN_TARGET={"In progress":14};
  function renderKanbanView(){

  const chDept=o=>(o.ownerBu||(o.assigns&&o.assigns[0]&&o.assigns[0].bu)||o.bu||"");
  const chRelated=o=>(o.assigns||[]).flatMap(g=>(g.members||[]).map(m=>({m,bu:g.bu||""})));
  function chYears(){const projs=nvApply(projects.filter(projMatches)).slice().sort((a,b)=>pindex(b)-pindex(a));

    projs.forEach(p=>{pushD(p);projTasks(p.id).filter(taskMatches).forEach(pushD);});

  function exportCharterXls(){

    const {projs,years,ncols,span}=D;

    const hex=st=>cssVal(statColor(st||"Not started"))||"#888";
    let h='<table border="1" style="border-collapse:collapse;font-family:sans-serif;font-size:12px"><thead>';
    h+='<tr><th colspan="8" bgcolor="#e9ecf4">Project Information</th>';

    h+='<tr><th>No.</th><th>Project Activity</th><th>Owner · ฝ่าย</th><th>Owner ที่เกี่ยวข้อง · ฝ่าย</th><th>Status</th><th>Start Date</th><th>Deadline</th><th>Days</th>';
    years.forEach(()=>CH_MONTHS.forEach(mn=>h+=`<th colspan="4">${cx(mn)}</th>`));h+='</tr>';
    h+='<tr>'+Array(8).fill('<th></th>').join('');for(let i=0;i<ncols;i++)h+=`<th>W${(i%4)+1}</th>`;h+='</tr></thead><tbody>';
    const ownTxt=o=>(o.owner||"—")+(chDept(o)?" · "+chDept(o):"");
    const relTxt=o=>{const r=chRelated(o);return r.length?r.map(x=>x.m+(x.bu?" · "+x.bu:"")).join(", "):"—";};
    const row=(o,no,isSub)=>{const sp=span(o),col=hex(o.status);
      let r='<tr>'+`<td align="center">${cx(no)}</td><td>${(isSub?"    ↳ ":"")+cx(isSub?o.title:o.name)}</td><td>${cx(ownTxt(o))}</td><td>${cx(relTxt(o))}</td>`
        +`<td align="center" bgcolor="${col}"><font color="#ffffff">${cx(o.status||"")}</font></td>`
        +`<td align="center">${o.start?cx(chFmtD(o.start)):""}</td><td align="center">${o.end?cx(chFmtD(o.end)):""}</td><td align="center">${o.start&&o.end?spentOf(o):""}</td>`;
      for(let i=0;i<ncols;i++){const on=sp&&i>=sp[0]&&i<=sp[1];r+=`<td${on?` bgcolor="${col}"`:""}></td>`;}
      return r+'</tr>';};
    projs.forEach((p,pi)=>{h+=row(p,String(pi+1),false);projTasks(p.id).filter(taskMatches).forEach((t,ti)=>{h+=row(t,(pi+1)+"."+(ti+1),true);});});
    h+='</tbody></table>';
    dl(new Blob(['﻿<html><head><meta charset="utf-8"></head><body>'+h+'</body></html>'],{type:"application/vnd.ms-excel"}),"project-charter.xls");

  function capData(){

    let h='<table border="1"><thead><tr>'+head.map(x=>`<th>${cx(x)}</th>`).join("")+'</tr></thead><tbody>';
    tasks.forEach(t=>{const p=projById(t.proj)||{};
      const row=[t.proj,p.name,p.pmo,p.scope,p.bu,(p.assigns||[]).map(g=>g.bu).filter(Boolean).join(", "),(p.assigns||[]).map(g=>g.bu+((g.members&&g.members.length)?" ("+g.members.join("/")+")":"")).join("; "),p.S!==undefined?vscore(p).toFixed(2):"",p.S!==undefined?pindex(p).toFixed(2):"",projStatus(t.proj),fjoin(p.files),t.id,t.title,t.owner,t.pmo,t.bu,(t.assigns||[]).map(g=>g.bu).filter(Boolean).join(", "),(t.assigns||[]).map(g=>g.bu+((g.members&&g.members.length)?" ("+g.members.join("/")+")":"")).join("; "),t.type,phaseOf(t),t.prio,t.status,t.start,t.end,spentOf(t),(t.comments||[]).map(c=>(c.by?c.by+": ":"")+c.text).join(" | "),fjoin(t.files)];
      h+='<tr>'+row.map(c=>`<td>${cx(c)}</td>`).join("")+'</tr>';});
    h+='</tbody></table>';
    dl(new Blob(['﻿<html><head><meta charset="utf-8"></head><body>'+h+'</body></html>'],{type:"application/vnd.ms-excel"}),"prio-board.xls");
  }
  $("#expsel").addEventListener("change",e=>{const v=e.target.value;e.target.selectedIndex=0;if(v==="json")exportJSON();else if(v==="xls")exportExcel();});
  $("#imp").addEventListener("click",()=>$("#impfile").click());
  $("#impfile").addEventListener("change",e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);if(o.projects&&o.tasks){projects=o.projects;tasks=o.tasks;normAll();filterProj=null;filterBU="";selId=null;render();}else alert("ไฟล์ไม่ถูกต้อง");}catch(err){alert("อ่านไฟล์ไม่ได้");}};r.readAsText(f);e.target.value="";});

  const themeBtn=$("#theme");
  function curDark(){const t=document.documentElement.dataset.theme;return t?t==="dark":matchMedia("(prefers-color-scheme:dark)").matches;}
  function syncIcon(){themeBtn.textContent=curDark()?"◑":"◐";}
  try{const stx=localStorage.getItem(TKEY);if(stx)document.documentElement.dataset.theme=stx;}catch(e){}
  themeBtn.addEventListener("click",()=>{const nv=curDark()?"light":"dark";document.documentElement.dataset.theme=nv;try{localStorage.setItem(TKEY,nv);}catch(e){}syncIcon();});
  syncIcon();

  $("#v-prio").addEventListener("click",()=>{view="prio";render();});
  $("#v-plan").addEventListener("click",()=>{view="planning";render();});
  $("#v-time").addEventListener("click",()=>{view="timeline";render();});
  $("#v-chart").addEventListener("click",()=>{view="charter";render();});
  $("#v-grid").addEventListener("click",()=>{view="grid";render();});
  $("#v-kanban").addEventListener("click",()=>{view="kanban";render();});
  $("#reset").addEventListener("click",()=>{filterProj=null;filterBU="";filterOwner="";filterPmo="";render();});
  $("#buFilter").addEventListener("change",e=>{filterBU=e.target.value;filterProj=null;render();});
  $("#ownerFilter").addEventListener("change",e=>{filterOwner=e.target.value;filterProj=null;render();});
  $("#pmoFilter").addEventListener("change",e=>{filterPmo=e.target.value;filterProj=null;render();});
  $("#lock").addEventListener("click",()=>{
    if(locked){const pw=prompt("🔒 ใส่รหัสเพื่อปลดล็อก:");if(pw===null)return;if(pw!==UNLOCK_PW){alert("❌ รหัสไม่ถูกต้อง");return;}locked=false;}
    else{locked=true;}
    closeDetail();render();});
  $("#buFilter").insertAdjacentHTML("beforeend",BUS.map(b=>`<option value="${esc(b)}">${esc(b)}</option>`).join(""));

  load(); normAll(); render(); initSync();
})();
</script>
