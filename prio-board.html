<style>
  :root{
    --paper:#faf9f6; --ink:#191c23; --ink-soft:#5b6472; --line:#e6e5df;
    --surface:#ffffff; --surface-2:#f2f3f0; --surface-3:#ecedeb;
    --accent:#2f6df0; --accent-ink:#1a49b0; --accent-soft:#e9f0ff;
    --copper:#a5702f; --copper-soft:#f6ecdd;
    --hi:#c0402f; --hi-soft:#fce3e1; --md:#b0761a; --md-soft:#fbefd6; --lo:#6b7482; --lo-soft:#edeff2;
    --st-todo:#6b7482; --st-prog:#2f6df0; --st-rev:#b0761a; --st-appr:#1f8f80; --st-uat:#6b5bd0; --st-done:#2e7d5b;
    --font:system-ui,-apple-system,"Segoe UI","Helvetica Neue","Noto Sans Thai","Sarabun",sans-serif;
    --mono:ui-monospace,"SF Mono","JetBrains Mono","Menlo",monospace;
    --serif:"Iowan Old Style","Palatino Linotype",Georgia,"Times New Roman",serif;
    --shadow:0 1px 2px rgba(20,25,40,.05),0 4px 14px rgba(20,25,40,.05);
  }
  @media (prefers-color-scheme:dark){:root{
    --paper:#0e1014; --ink:#eef1f6; --ink-soft:#a7b1c0; --line:#343c49;
    --surface:#191e26; --surface-2:#242a36; --surface-3:#2f3743;
    --accent:#6f9dff; --accent-ink:#bcd2ff; --accent-soft:#1c2e4d;
    --copper:#e0bd8f; --copper-soft:#3a2c17;
    --hi:#f0806e; --hi-soft:#4a231d; --md:#e0a747; --md-soft:#41310f; --lo:#94a0b1; --lo-soft:#272d38;
    --st-todo:#94a0b1; --st-prog:#6f9dff; --st-rev:#e0a747; --st-appr:#57cbba; --st-uat:#a99bff; --st-done:#5fd0a2;
    --shadow:0 1px 2px rgba(0,0,0,.35),0 8px 22px rgba(0,0,0,.45);
  }}
  :root[data-theme="dark"]{
    --paper:#0e1014; --ink:#eef1f6; --ink-soft:#a7b1c0; --line:#343c49;
    --surface:#191e26; --surface-2:#242a36; --surface-3:#2f3743;
    --accent:#6f9dff; --accent-ink:#bcd2ff; --accent-soft:#1c2e4d;
    --copper:#e0bd8f; --copper-soft:#3a2c17;
    --hi:#f0806e; --hi-soft:#4a231d; --md:#e0a747; --md-soft:#41310f; --lo:#94a0b1; --lo-soft:#272d38;
    --st-todo:#94a0b1; --st-prog:#6f9dff; --st-rev:#e0a747; --st-appr:#57cbba; --st-uat:#a99bff; --st-done:#5fd0a2;
    --shadow:0 1px 2px rgba(0,0,0,.35),0 8px 22px rgba(0,0,0,.45);
  }
  :root[data-theme="light"]{
    --paper:#faf9f6; --ink:#191c23; --ink-soft:#5b6472; --line:#e6e5df;
    --surface:#ffffff; --surface-2:#f2f3f0; --surface-3:#ecedeb;
    --accent:#2f6df0; --accent-ink:#1a49b0; --accent-soft:#e9f0ff;
    --copper:#a5702f; --copper-soft:#f6ecdd;
    --hi:#c0402f; --hi-soft:#fce3e1; --md:#b0761a; --md-soft:#fbefd6; --lo:#6b7482; --lo-soft:#edeff2;
    --st-todo:#6b7482; --st-prog:#2f6df0; --st-rev:#b0761a; --st-appr:#1f8f80; --st-uat:#6b5bd0; --st-done:#2e7d5b;
    --shadow:0 1px 2px rgba(20,25,40,.05),0 4px 14px rgba(20,25,40,.05);
  }
  *{box-sizing:border-box} body{margin:0;font-family:var(--font);color:var(--ink)}
  .app{background:var(--paper);color:var(--ink);font-family:var(--font);min-height:100vh;padding:0 clamp(14px,3vw,32px) 40px;-webkit-font-smoothing:antialiased}
  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
  .bar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 0;margin-bottom:6px}
  .logo{height:40px;width:40px;border-radius:9px;flex:none;box-shadow:var(--shadow);object-fit:cover}
  .brand{display:flex;flex-direction:column;gap:1px;min-width:0}
  .brand .kicker{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--copper);font-weight:700}
  .brand h1{margin:0;font-family:var(--serif);font-size:clamp(1.18rem,.95rem+.9vw,1.6rem);font-weight:700;letter-spacing:-.01em}
  .spacer{flex:1 1 auto}
  .seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
  .seg button{font:inherit;font-size:.82rem;font-weight:600;border:0;background:transparent;color:var(--ink-soft);padding:6px 12px;border-radius:7px;cursor:pointer;transition:.15s}
  .seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
  .seg button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .ghost{font:inherit;font-size:.82rem;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--ink-soft);padding:7px 12px;border-radius:9px;cursor:pointer;transition:.15s}
  .ghost:hover{border-color:var(--accent);color:var(--accent-ink)}
  .ghost:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .ghost[hidden]{display:none}
  .ghost:disabled,.addbtn:disabled{opacity:.4;cursor:not-allowed}
  #lock.on{border-color:var(--hi);color:var(--hi);background:var(--hi-soft)}
  .app.locked .pedit{display:none}
  .app.locked .addbtn{display:none}
  .icon{width:38px;height:36px;display:grid;place-items:center;padding:0;font-size:1rem}
  select.ghost{padding:7px 10px}
  #expsel{width:118px}
  #buFilter{max-width:170px}
  .saved{font-family:var(--mono);font-size:.68rem;color:var(--st-done);opacity:0;transition:opacity .3s}
  .saved.show{opacity:1}
  .synctag{font-family:var(--mono);font-size:.68rem;font-weight:700;padding:2px 9px;border-radius:99px;border:1px solid var(--line);display:none}
  .zone{padding:18px 0 4px}
  .zlab{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
  .zlab .n{font-family:var(--mono);font-size:.7rem;font-weight:700;color:var(--paper);background:var(--ink);width:20px;height:20px;border-radius:6px;display:grid;place-items:center;flex:none}
  .zlab h2{margin:0;font-family:var(--serif);font-size:1.28rem;font-weight:600;letter-spacing:-.005em}
  .impact{display:flex;flex-direction:column;gap:16px}
  .impact-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
  .igh{display:flex;align-items:center;gap:8px;margin-bottom:10px}
  .igh .tag-lbl{display:inline-flex;align-items:center;gap:6px;font-size:.76rem;font-weight:800;color:var(--ink);background:var(--surface-2);border:1px solid var(--line);border-radius:99px;padding:4px 12px}
  .igh .cnt{font-family:var(--mono);font-size:.72rem;font-weight:700;color:var(--accent-ink);background:var(--accent-soft);border-radius:99px;padding:2px 9px}
  .count-badge{font-family:var(--mono);font-size:.72rem;font-weight:700;color:var(--accent-ink);background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 30%,transparent);border-radius:99px;padding:2px 10px}
  .igroup{border:1.5px dashed transparent;border-radius:16px;transition:.15s;padding:3px}
  .igroup.idrop{border-color:var(--accent);background:var(--accent-soft)}
  .scope-chip{font-size:.6rem;font-weight:800;padding:2px 7px;border-radius:99px;white-space:nowrap}
  .scope-chip.corp{color:var(--accent-ink);background:var(--accent-soft)}
  .scope-chip.bu{color:var(--copper);background:var(--copper-soft)}
  .pmo-chip{font-size:.6rem;font-weight:800;padding:2px 7px;border-radius:99px;white-space:nowrap;color:var(--ink);background:var(--surface-2);border:1px solid var(--line)}
  .stat-chip{display:inline-flex;align-items:center;gap:4px;font-size:.6rem;font-weight:800;padding:2px 7px;border-radius:99px;white-space:nowrap;color:var(--ink);background:var(--surface-2);border:1px solid var(--line)}
  .stat-chip .pd{width:6px;height:6px;border-radius:99px}
  .team-chip{font-size:.6rem;font-weight:800;padding:2px 7px;border-radius:99px;white-space:nowrap;color:var(--accent-ink);background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 25%,transparent)}
  .chip-box{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
  .chip2{display:inline-flex;align-items:center;gap:5px;font-size:.8rem;font-weight:600;background:var(--accent-soft);color:var(--accent-ink);border:1px solid var(--accent);border-radius:99px;padding:3px 6px 3px 11px}
  .chip2 .cx{border:0;background:transparent;color:var(--accent-ink);cursor:pointer;font-size:.72rem;padding:0}
  .chip-add{font:inherit;font-size:.8rem;border:1px dashed var(--line);background:var(--surface-2);color:var(--ink);border-radius:8px;padding:6px 8px;cursor:pointer}
  .chip-inwrap{display:inline-flex;gap:4px}
  .chip-in{font:inherit;font-size:.8rem;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:5px 8px;width:130px}
  .chip-addbtn{border:1px solid var(--line);background:var(--surface-2);color:var(--accent-ink);border-radius:8px;font-weight:700;cursor:pointer;padding:0 10px}
  button.a-add{max-width:100%;white-space:normal;line-height:1.3}
  .assign-row{border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:8px;margin-bottom:8px}
  .assign-head{display:flex;gap:8px;align-items:center}
  .assign-head .a-bu{flex:1;font:inherit;font-size:.86rem;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 9px}
  .assign-head .a-del{border:1px solid var(--line);background:var(--surface);color:var(--ink-soft);border-radius:8px;cursor:pointer;padding:4px 9px}
  .assign-head .a-del:hover{color:var(--hi);border-color:var(--hi)}
  .pcard{position:relative;text-align:left;font:inherit;cursor:grab;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:15px 16px;box-shadow:var(--shadow);transition:transform .15s,border-color .15s;overflow:hidden}
  .pcard.dragging,.pmini.dragging{opacity:.45}
  .pcard:hover{transform:translateY(-2px)}
  .pcard:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .pcard[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft),var(--shadow)}
  .pcard .prow{display:flex;align-items:center;gap:7px;margin-bottom:9px;flex-wrap:wrap;padding-right:30px}
  .pedit{position:absolute;top:12px;right:12px;width:26px;height:26px;border-radius:7px;border:1px solid var(--line);background:var(--surface);color:var(--ink-soft);cursor:pointer;display:grid;place-items:center;font-size:.78rem;z-index:2}
  .pedit:hover{border-color:var(--accent);color:var(--accent-ink)}
  .rank{font-family:var(--mono);font-weight:800;font-size:.78rem;color:var(--ink-soft)}
  .pf{font-family:var(--mono);font-size:.62rem;font-weight:700;padding:2px 6px;border-radius:5px;background:var(--surface-2);color:var(--ink-soft);border:1px solid var(--line)}
  .pcard h3{margin:0 0 12px;font-size:.96rem;font-weight:700;line-height:1.25;letter-spacing:-.01em}
  .pi{display:flex;align-items:flex-end;gap:6px;margin-bottom:8px}
  .pi b{font-family:var(--mono);font-size:1.55rem;font-weight:800;line-height:.9;color:var(--accent-ink);font-variant-numeric:tabular-nums}
  .pi span{font-family:var(--mono);font-size:.62rem;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.12em;font-weight:600;padding-bottom:2px}
  .vbar{height:7px;border-radius:99px;background:var(--surface-3);overflow:hidden;margin-bottom:11px}
  .vbar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--copper),var(--accent))}
  .pmeta{display:flex;align-items:center;gap:8px;font-size:.74rem;color:var(--ink-soft)}
  .chip{font-family:var(--mono);font-size:.68rem;font-weight:700;padding:2px 7px;border-radius:6px;background:var(--surface-2);border:1px solid var(--line)}
  .prog{flex:1;height:6px;border-radius:99px;background:var(--surface-3);overflow:hidden;min-width:34px}
  .prog i{display:block;height:100%;background:var(--st-done)}
  .pmini{width:100%;text-align:left;font:inherit;cursor:grab;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 12px;box-shadow:var(--shadow);transition:transform .12s,border-color .12s}
  .pmini:hover{transform:translateY(-1px)}
  .pmini:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .pmini[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft),var(--shadow)}
  .pm-top{display:flex;align-items:center;gap:7px;margin-bottom:6px}
  .pm-pi{margin-left:auto;font-family:var(--mono);font-size:.72rem;font-weight:800;color:var(--accent-ink)}
  .pm-name{font-size:.84rem;font-weight:700;line-height:1.25;margin-bottom:9px}
  .pm-meta{display:flex;align-items:center;gap:7px;font-size:.7rem;color:var(--ink-soft)}
  .board-wrap{overflow-x:auto;padding-bottom:8px}
  .board{display:flex;gap:14px;min-width:min-content}
  .col{flex:0 0 250px;display:flex;flex-direction:column;background:var(--surface-2);border:1px solid var(--line);border-radius:16px;padding:12px;transition:background .15s,box-shadow .15s}
  .col.drop{background:var(--accent-soft);box-shadow:inset 0 0 0 2px var(--accent)}
  .col-h{display:flex;align-items:center;gap:8px;margin:2px 4px 12px}
  .dot{width:9px;height:9px;border-radius:99px;flex:none}
  .col-h .t{font-weight:800;font-size:.86rem}
  .col-h .c{font-family:var(--mono);font-size:.72rem;font-weight:700;color:var(--ink-soft);background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:1px 8px}
  .col-h .d{margin-left:auto;font-family:var(--mono);font-size:.7rem;color:var(--ink-soft)}
  .stack{display:flex;flex-direction:column;gap:10px;min-height:40px}
  .tcard{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 13px 11px 16px;box-shadow:var(--shadow);cursor:pointer;transition:transform .12s,box-shadow .12s,opacity .12s}
  .tcard:hover{transform:translateY(-1px);box-shadow:0 2px 4px rgba(20,25,40,.06),0 8px 20px rgba(20,25,40,.09)}
  .tcard:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .tcard.dragging{opacity:.45}
  .tcard.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft),var(--shadow)}
  .tcard .stripe{position:absolute;left:0;top:0;bottom:0;width:4px;border-radius:12px 0 0 12px}
  .tcard .top{display:flex;align-items:center;gap:6px;margin-bottom:7px}
  .ptag{display:inline-flex;align-items:center;gap:5px;font-size:.68rem;font-weight:700;color:var(--ink-soft);background:var(--surface-2);border:1px solid var(--line);border-radius:99px;padding:2px 8px 2px 6px}
  .ptag .pd{width:7px;height:7px;border-radius:99px}
  .adhoc{font-size:.62rem;font-weight:800;color:var(--md);background:var(--md-soft);border-radius:99px;padding:2px 7px}
  .tid{margin-left:auto;font-family:var(--mono);font-size:.66rem;color:var(--ink-soft)}
  .tcard .ttl{font-size:.86rem;font-weight:600;line-height:1.32;margin:0 0 8px}
  .tcard .cmt{font-size:.74rem;color:var(--ink-soft);margin:0 0 9px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .tcard .foot{display:flex;align-items:center;gap:8px}
  .av{width:22px;height:22px;border-radius:99px;display:grid;place-items:center;font-size:.66rem;font-weight:800;color:#fff;flex:none}
  .who{font-size:.74rem;color:var(--ink-soft);margin-right:auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .lab{font-family:var(--mono);font-size:.62rem;font-weight:700;padding:2px 7px;border-radius:6px;white-space:nowrap}
  .spent{font-family:var(--mono);font-size:.7rem;color:var(--ink-soft);font-variant-numeric:tabular-nums;white-space:nowrap}
  .empty{font-size:.76rem;color:var(--ink-soft);text-align:center;padding:16px 6px;border:1px dashed var(--line);border-radius:10px}
  .tl{border:1px solid var(--line);border-radius:16px;background:var(--surface);padding:14px 16px;overflow-x:auto}
  .tl-inner{min-width:640px}
  .tl-axis{position:relative;height:20px;margin-left:140px;border-bottom:1px solid var(--line);margin-bottom:10px}
  .tl-tick{position:absolute;top:0;transform:translateX(-50%);font-family:var(--mono);font-size:.64rem;color:var(--ink-soft)}
  .tl-tick::after{content:"";position:absolute;left:50%;top:16px;width:1px;height:9999px;background:var(--line);opacity:.5}
  .tl-lane{display:flex;align-items:stretch;gap:10px;margin:6px 0}
  .tl-lname{flex:0 0 130px;display:flex;align-items:center;gap:7px;font-size:.78rem;font-weight:700;overflow:hidden}
  .tl-track{position:relative;flex:1;min-height:34px;background:var(--surface-2);border-radius:8px}
  .tl-bar{position:absolute;top:5px;height:24px;border-radius:7px;display:flex;align-items:center;gap:6px;padding:0 9px;color:#fff;font-size:.7rem;font-weight:700;cursor:pointer;overflow:hidden;white-space:nowrap;box-shadow:var(--shadow);transition:transform .12s;border:0}
  .tl-bar:hover{transform:translateY(-1px);filter:brightness(1.05)}
  .tl-bar:focus-visible{outline:2px solid var(--ink);outline-offset:1px}
  .tl-bar .bd{width:6px;height:6px;border-radius:99px;background:rgba(255,255,255,.85);flex:none}
  .addbtn{font:inherit;font-size:.8rem;font-weight:700;border:1px dashed var(--line);background:transparent;color:var(--accent-ink);border-radius:9px;padding:6px 12px;cursor:pointer;white-space:nowrap}
  .addbtn:hover{border-color:var(--accent);background:var(--accent-soft)}
  .scrim{position:fixed;inset:0;background:rgba(15,17,21,.32);opacity:0;pointer-events:none;transition:opacity .2s;z-index:40}
  .scrim.show{opacity:1;pointer-events:auto}
  .drawer{position:fixed;top:0;right:0;height:100%;width:min(420px,94vw);background:var(--surface);color:var(--ink);border-left:1px solid var(--line);box-shadow:-8px 0 30px rgba(0,0,0,.15);z-index:50;transform:translateX(100%);transition:transform .24s cubic-bezier(.16,1,.3,1);display:flex;flex-direction:column;overflow:hidden}
  .drawer.open{transform:translateX(0)}
  .dw-h{display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line)}
  .dw-h .did{font-family:var(--mono);font-size:.72rem;color:var(--ink-soft)}
  .dw-h .close{margin-left:auto;width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink-soft);cursor:pointer;font-size:1rem;display:grid;place-items:center}
  .dw-h .close:hover{border-color:var(--accent);color:var(--accent-ink)}
  .dw-body{padding:16px 18px;overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column;gap:14px}
  .fld{display:flex;flex-direction:column;gap:5px}
  .fld label{font-size:.68rem;text-transform:uppercase;letter-spacing:.07em;font-weight:700;color:var(--ink-soft)}
  .fld input,.fld select,.fld textarea{font:inherit;font-size:.86rem;color:var(--ink);background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:8px 10px;width:100%;min-width:0}
  .fld input:focus,.fld select:focus,.fld textarea:focus{outline:2px solid var(--accent);outline-offset:0;border-color:var(--accent)}
  .fld input[readonly]{opacity:.7;cursor:default}
  .fld textarea{resize:vertical;min-height:62px}
  .f-title input{font-size:1rem;font-weight:700}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .grid5{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
  .grid5 .fld label{text-align:center}
  .ptag-ro{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;font-weight:700;color:var(--ink);background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:7px 10px;width:max-content}
  .ptag-ro .pd{width:8px;height:8px;border-radius:99px}
  .subhead{display:flex;align-items:center;justify-content:space-between}
  .subhead .pct{font-family:var(--mono);font-size:.72rem;color:var(--ink-soft)}
  .subwrap-box{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
  .subtable{width:100%;border-collapse:collapse;font-size:.76rem;min-width:420px}
  .subtable th{text-align:left;font-size:.58rem;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-soft);font-weight:700;padding:7px 8px;background:var(--surface-2);border-bottom:1px solid var(--line);white-space:nowrap}
  .subtable td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:middle;color:var(--ink);font-weight:500}

      else items.forEach(t=>stack.appendChild(taskCard(t)));

      c.addEventListener("dragleave",()=>c.classList.remove("drop"));

      board.appendChild(c);
    });

  }

  function renderTimeline(){
    const main=$("#main"); main.innerHTML="";
    if(ganttExp===null){ganttExp={};projects.forEach(p=>ganttExp[p.id]=true);}
    const projs=projects.filter(projMatches);
    const dates=[];
    const collect=o=>{const s=new Date(o.start),e=new Date(o.end);if(!isNaN(s))dates.push(s);if(!isNaN(e))dates.push(e);};
    projs.forEach(p=>{collect(p);projTasks(p.id).filter(taskMatches).forEach(collect);});
    const box=el("div","gantt");
    if(!dates.length){const e=el("div","empty");e.style.margin="16px";e.textContent="ไม่มีงานที่มีวันที่ในตัวกรองนี้";box.appendChild(e);main.appendChild(box);return;}
    const fmtY=s=>{const x=new Date(s);return isNaN(x)?"—":(String(x.getDate()).padStart(2,"0")+"/"+String(x.getMonth()+1).padStart(2,"0")+"/"+x.getFullYear());};
    let min=new Date(Math.min(...dates)), max=new Date(Math.max(...dates));
    min=new Date(+min-3*864e5);
    const AXIS_END=new Date("2027-12-31");            // ยืดถึงสิ้นปี 2027
    max=new Date(Math.max(+max+3*864e5,+AXIS_END));
    min.setHours(0,0,0,0); max.setHours(0,0,0,0);
    const totalDays=Math.max(Math.round((max-min)/864e5),30);
    const span=max-min;
    const pos=d=>{const x=new Date(d);return isNaN(x)?0:(x-min)/span*100;};
    const PX_PER_DAY=5, trackPx=Math.max(Math.round(totalDays*PX_PER_DAY),700);
    // tick + gridline รายเดือน (วันที่ 1 ของแต่ละเดือน)
    let ticks="",gl="";
    for(let d=new Date(min.getFullYear(),min.getMonth(),1); d<=max; d.setMonth(d.getMonth()+1)){if(d<min)continue;const L=pos(d);const yy=String(d.getFullYear()).slice(2);ticks+=`<div class="g-tick" style="left:${L}%">${(d.getMonth()+1)+"/"+yy}</div>`;gl+=`<div class="g-gl" style="left:${L}%"></div>`;}
    const today=new Date();today.setHours(0,0,0,0);
    const tline=(today>=min&&today<=max)?`<div class="g-today" style="left:${pos(today)}%"><span class="lb">วันนี้</span></div>`:"";
    const bar=(o,color,isSub)=>{const s=new Date(o.start),e=new Date(o.end);if(isNaN(s)||isNaN(e)||e<s)return "";const left=pos(s),w=Math.max((e-s+864e5)/span*100,1.4);const done=o.status==="Done";return `<button class="g-bar ${done?"done":""}" data-id="${esc(o.id)}"${isSub?' data-sub="1"':''} style="left:${left}%;width:${w}%;background:${color}" title="${esc(fmt(o.start))} → ${esc(fmt(o.end))}"><span class="bd"></span>${isSub?esc(phaseOf(o)):esc(o.id)}</button>`;};
    let rows="";
    projs.forEach(p=>{
      const subs=projTasks(p.id).filter(taskMatches);
      const exp=ganttExp[p.id]!==false;
      const di=dueMeta(p), stc=statColor(p.status), col=pcolor(p.id);
      rows+=`<div class="g-row"><div class="g-left"><div class="g-nm"><button class="exp" data-tid="${esc(p.id)}">${subs.length?(exp?"▾":"▸"):""}</button><span class="dot" style="background:${col}"></span><span class="nm" data-pid="${esc(p.id)}">${esc(p.name)}</span></div>
        <div class="g-st"><span class="g-stp" style="color:var(${stc});background:color-mix(in srgb,var(${stc}) 15%,transparent)">${esc(p.status)}</span></div>
        <div class="g-dt">${p.start?fmtY(p.start):"—"}</div>
        <div class="g-dt ${di.cls==="over"?"over":""}">${p.end?fmtY(p.end):"—"}</div></div>
        <div class="g-tr">${gl}${tline}${bar(p,col,false)}</div></div>`;
      if(exp)subs.forEach(t=>{const di2=dueMeta(t),stc2=statColor(t.status),phc="var("+(PHASE_COLOR[phaseOf(t)]||"--st-todo")+")";
        rows+=`<div class="g-row sub"><div class="g-left"><div class="g-nm sub"><span class="dot" style="background:${phc}"></span><span class="nm" data-tid2="${esc(t.id)}">${esc(t.title)}</span></div>
          <div class="g-st"><span class="g-stp" style="color:${phc};background:color-mix(in srgb,${phc} 16%,transparent)">${esc(t.status)}</span></div>
          <div class="g-dt">${t.start?fmtY(t.start):"—"}</div>
          <div class="g-dt ${di2.cls==="over"?"over":""}">${t.end?fmtY(t.end):"—"}</div></div>
          <div class="g-tr">${gl}${tline}${bar(t,phc,true)}</div></div>`;});
    });
    box.innerHTML=`<div class="gantt-scroll"><div class="gantt-inner" style="--trackpx:${trackPx}px">
      <div class="g-head"><div class="g-left-h"><div>Project / งาน</div><div>Status</div><div>Start</div><div>Due</div></div><div class="g-th">${ticks}</div></div>
      <div>${rows}</div>
      <div class="g-legend">${PHASES.map(p=>`<span class="lg"><span class="sw" style="background:var(${PHASE_COLOR[p]})"></span>${esc(p)}</span>`).join("")}<span class="lg" style="margin-left:auto"><span class="sw" style="background:var(--hi)"></span>เส้นวันนี้ · แท่งจาง=Done</span></div>
    </div></div>`;
    main.appendChild(box);
    box.querySelectorAll(".exp").forEach(b=>b.addEventListener("click",()=>{const id=b.dataset.tid;ganttExp[id]=ganttExp[id]===false?true:false;renderTimeline();}));
    box.querySelectorAll("[data-pid]").forEach(n=>n.addEventListener("click",()=>openProjectDetail(n.dataset.pid)));
    box.querySelectorAll("[data-tid2]").forEach(n=>n.addEventListener("click",()=>openTaskDetail(n.dataset.tid2)));
    box.querySelectorAll(".g-bar").forEach(b=>b.addEventListener("click",()=>{if(b.dataset.sub)openTaskDetail(b.dataset.id);else openProjectDetail(b.dataset.id);}));
  }
  function capData(){
    const map={};
    tasks.filter(taskMatches).forEach(t=>{const who=t.owner;if(!who)return;if(!map[who])map[who]={who,days:0,wip:0};map[who].days+=(DAYS_OF[t.size]||0);if(["M","L","XL"].indexOf(t.size)>=0&&WIP_EXCLUDE.indexOf(t.status)<0)map[who].wip++;});
    return Object.values(map).sort((a,b)=>b.days-a.days);
  }

      <div class="cap-list">${cap.map(x=>{const pct=Math.round(x.days/CAP_BUDGET*100),fill=Math.min(pct,100),cls=pct>100?"over":pct>85?"mid":"ok",bad=x.wip>2;
        return `<div class="cap-row" data-who="${esc(x.who)}" tabindex="0" role="button"><div class="who"><span class="av" style="background:${pcolor(x.who)}">${esc(x.who.slice(0,1))}</span><span class="nm">${esc(x.who)}</span></div>
          <div class="cap-bw"><div class="cap-track"><div class="cap-fill ${cls}" style="width:${fill}%"></div><div class="cap-budget" style="left:100%"></div></div>
          <div class="cap-detail"><span class="${pct>100?"o":""}">${x.days.toFixed(1)} / ${CAP_BUDGET} วัน (${pct}%)</span>${bad?'<span class="wipflag">WIP เกิน 2</span>':''}</div></div>
          <div class="cap-wip ${bad?"bad":""}"><span class="n">${x.wip}</span><span class="l">งาน M+</span></div></div>`;}).join("")||'<div class="empty">ไม่มี owner ในตัวกรองนี้</div>'}</div>`;
    wrap.appendChild(csec);
    main.appendChild(wrap);
    const thr=$("#thr");if(thr)thr.addEventListener("input",e=>{TH=+e.target.value;const v=$("#thrv");if(v)v.textContent=TH.toFixed(1);renderPlanning();});

    let h='<table border="1"><thead><tr>'+head.map(x=>`<th>${cx(x)}</th>`).join("")+'</tr></thead><tbody>';
    tasks.forEach(t=>{const p=projById(t.proj)||{};
      const row=[t.proj,p.name,p.pmo,p.scope,p.bu,(p.assigns||[]).map(g=>g.bu).filter(Boolean).join(", "),(p.assigns||[]).map(g=>g.bu+((g.members&&g.members.length)?" ("+g.members.join("/")+")":"")).join("; "),p.S!==undefined?vscore(p).toFixed(2):"",p.S!==undefined?pindex(p).toFixed(2):"",projStatus(t.proj),fjoin(p.files),t.id,t.title,t.owner,t.pmo,t.bu,(t.assigns||[]).map(g=>g.bu).filter(Boolean).join(", "),(t.assigns||[]).map(g=>g.bu+((g.members&&g.members.length)?" ("+g.members.join("/")+")":"")).join("; "),t.type,phaseOf(t),t.prio,t.status,t.start,t.end,spentOf(t),t.comment,fjoin(t.files)];
      h+='<tr>'+row.map(c=>`<td>${cx(c)}</td>`).join("")+'</tr>';});
    h+='</tbody></table>';
    dl(new Blob(['﻿<html><head><meta charset="utf-8"></head><body>'+h+'</body></html>'],{type:"application/vnd.ms-excel"}),"prio-board.xls");
  }
  $("#expsel").addEventListener("change",e=>{const v=e.target.value;e.target.selectedIndex=0;if(v==="json")exportJSON();else if(v==="xls")exportExcel();});
  $("#imp").addEventListener("click",()=>$("#impfile").click());
  $("#impfile").addEventListener("change",e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);if(o.projects&&o.tasks){projects=o.projects;tasks=o.tasks;normAll();filterProj=null;filterBU="";selId=null;render();}else alert("ไฟล์ไม่ถูกต้อง");}catch(err){alert("อ่านไฟล์ไม่ได้");}};r.readAsText(f);e.target.value="";});

  const themeBtn=$("#theme");
  function curDark(){const t=document.documentElement.dataset.theme;return t?t==="dark":matchMedia("(prefers-color-scheme:dark)").matches;}
  function syncIcon(){themeBtn.textContent=curDark()?"☀️":"🌙";}
  try{const stx=localStorage.getItem(TKEY);if(stx)document.documentElement.dataset.theme=stx;}catch(e){}
  themeBtn.addEventListener("click",()=>{const nv=curDark()?"light":"dark";document.documentElement.dataset.theme=nv;try{localStorage.setItem(TKEY,nv);}catch(e){}syncIcon();});
  syncIcon();

  $("#v-prio").addEventListener("click",()=>{view="prio";render();});
  $("#v-stat").addEventListener("click",()=>{view="stat";render();});
  $("#v-plan").addEventListener("click",()=>{view="planning";render();});
  $("#v-time").addEventListener("click",()=>{view="timeline";render();});
  $("#reset").addEventListener("click",()=>{filterProj=null;filterBU="";filterOwner="";filterPmo="";render();});
  $("#buFilter").addEventListener("change",e=>{filterBU=e.target.value;filterProj=null;render();});
  $("#ownerFilter").addEventListener("change",e=>{filterOwner=e.target.value;filterProj=null;render();});
  $("#pmoFilter").addEventListener("change",e=>{filterPmo=e.target.value;filterProj=null;render();});
  $("#lock").addEventListener("click",()=>{locked=!locked;try{localStorage.setItem("em_prio_lock",locked?"1":"0");}catch(e){}closeDetail();render();});
  $("#buFilter").insertAdjacentHTML("beforeend",BUS.map(b=>`<option value="${esc(b)}">${esc(b)}</option>`).join(""));

  load(); normAll(); render(); initSync();
})();
</script>
